name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Check authoring script preflight
        run: |
          bash -n scripts/run-catalog-sync-authoring.sh
          bash -n scripts/install-eal-runtime.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Exercise generated collectors in isolated language toolchains
        if: runner.os == 'Linux'
        run: |
          docker pull python:3.13-slim
          docker pull node:24-slim
          cargo test --locked --test tooling_docker -- --include-ignored
      - run: cargo build --locked --release

  eal-compatibility:
    name: EAL producer and consumer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Source includes the runtime fixes and versioned collector contract producer.
      EAL_REVISION: d13e13e5edcb0a269e605076ea143804cbe47721
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emmett08/eal-mcp
          ref: ${{ env.EAL_REVISION }}
          path: .eal-producer
          persist-credentials: false
      - name: Install both declared toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install 1.90.0 --profile minimal
      - name: Build the pinned EAL producer and native companions
        working-directory: .eal-producer
        run: cargo +1.90.0 build --workspace --bins --locked
      - name: Check published collector descriptors
        run: |
          test "$(git -C .eal-producer rev-parse HEAD)" = "$EAL_REVISION"
          .eal-producer/target/debug/eal-collector describe > "$RUNNER_TEMP/eal-collector-catalogue.json"
          python3 -c 'import json, os; from pathlib import Path; expected=json.loads(Path("contracts/collectors/native.json").read_text()); actual=json.loads((Path(os.environ["RUNNER_TEMP"])/"eal-collector-catalogue.json").read_text()); assert actual == expected, "published collector catalogue differs from the pinned consumer contract"'
      - name: Exercise generated EAL, registries and independent collector domains
        run: |
          export ENGARG_EAL_HOST="$PWD/.eal-producer/target/debug/eal-host"
          export EAL_CORE="$PWD/.eal-producer/target/debug/eal-core"
          test -x "$ENGARG_EAL_HOST"
          test -x "$EAL_CORE"
          cargo +1.99.1 test --locked --test eal_live --test eal_export --test eal_acquisition --test native_collectors --test collector_catalogue_live --test export_v3 -- --include-ignored
      - name: Verify the installed pinned runtime and cached startup
        run: |
          engarg_runtime_root="$RUNNER_TEMP/engarg-eal-runtime"
          engarg_runtime_host=$(bash scripts/install-eal-runtime.sh --root "$engarg_runtime_root")
          test "$engarg_runtime_host" = "$engarg_runtime_root/bin/eal-host"
          test "$(bash scripts/install-eal-runtime.sh --root "$engarg_runtime_root")" = "$engarg_runtime_host"
          cargo +1.99.1 build --locked --bin engarg --bin engarg-process-supervisor
          mkdir -p "$RUNNER_TEMP/engarg-eal-probe"
          target/debug/engarg eal describe --eal-host "$engarg_runtime_host" \
            --workspace "$RUNNER_TEMP/engarg-eal-probe" \
            --output "$RUNNER_TEMP/engarg-eal-probe/describe.json"
          python3 -c 'import json, os; from pathlib import Path; response=json.loads((Path(os.environ["RUNNER_TEMP"])/"engarg-eal-probe/describe.json").read_text()); assert response["is_error"] is False; assert response["result"]["source_syntax"] == "EAL/3"; assert "structured/1" in response["result"]["methods"]'
