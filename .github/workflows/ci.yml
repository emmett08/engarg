name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Only a newer revision of this PR supersedes a running result. Main pushes
  # retain independent groups so every accepted main revision remains checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Keep filename/line backtraces and normal test assertions/overflow checks.
      # Cache dependency outputs without retaining large incremental sessions.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    # Cold toolchain builds and installation verify all pinned native packages.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          rustup toolchain install 1.90.0 --profile minimal
      - uses: ./.github/actions/cargo-cache
        with:
          scope: checks
          toolchains: 1.99.1 1.90.0
      - name: Check authoring script preflight
        run: |
          bash -n scripts/run-catalog-sync-authoring.sh
          bash -n scripts/install-eal-runtime.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: ./.github/actions/eal-process-contracts
      - name: Check recorded argument HTML
        run: python3 scripts/render-example-arguments.py --engarg target/debug/engarg --check
      - run: cargo build --locked --release
      - uses: ./.github/actions/eal-runtime
        with:
          root: ${{ runner.temp }}/engarg-eal-runtime
      - name: Verify the installed pinned runtime and cached startup
        run: |
          engarg_runtime_root=$(python3 -c 'import os; from pathlib import Path; print((Path(os.environ["RUNNER_TEMP"])/"engarg-eal-runtime").resolve())')
          engarg_runtime_host="$ENGARG_EAL_HOST"
          test "$engarg_runtime_host" = "$engarg_runtime_root/bin/eal-host"
          test "$(bash scripts/install-eal-runtime.sh --root "$engarg_runtime_root")" = "$engarg_runtime_host"
          mkdir -p "$RUNNER_TEMP/engarg-eal-probe"
          target/release/engarg eal describe --eal-host "$engarg_runtime_host" \
            --workspace "$RUNNER_TEMP/engarg-eal-probe" \
            --output "$RUNNER_TEMP/engarg-eal-probe/describe.json"
          python3 -c 'import json, os; from pathlib import Path; response=json.loads((Path(os.environ["RUNNER_TEMP"])/"engarg-eal-probe/describe.json").read_text()); assert response["is_error"] is False; assert response["result"]["source_syntax"] == "EAL/4"; assert "structured/1" in response["result"]["methods"]'
      - name: Execute installed EAL packages and reasoning modes
        run: cargo test --locked --test executable_package --test executable_modes --test support_cli --test aspic_view --test optimal_argument_cli -- --ignored
      - name: Investigate generated arguments with frozen native checks
        run: cargo test --locked --test argument_investigation native_investigation -- --ignored

  prepared-toolchains:
    name: Prepared evidence APIs (${{ matrix.family }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [python, rust, go, node]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: ./.github/actions/cargo-cache
        with:
          scope: prepared-${{ matrix.family }}
          toolchains: 1.99.1
      - name: Prepare the selected dependency image
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          case "$FAMILY" in
            python)
              docker pull python:3.13-slim
              docker build --tag engarg-python-evidence:0.14-prepared examples/toolchains/python-evidence
              ;;
            rust) docker build --tag engarg-rust-tools:1.99.1 examples/toolchains/rust ;;
            go) docker build --tag engarg-go-tools:1.25.14 examples/toolchains/go ;;
            node)
              docker build --target javascript --tag engarg-javascript-tools:24 examples/toolchains/typescript
              docker build --tag engarg-typescript-tools:5.9.3 examples/toolchains/typescript
              ;;
          esac
      - uses: ./.github/actions/eal-runtime
        with:
          root: ${{ runner.temp }}/engarg-eal-runtime
      - name: Verify offline APIs and the generated-tool protocol
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          case "$FAMILY" in
            python)
              cargo test --locked --test prepared_toolchains python_ -- --ignored
              cargo test --locked --test tooling_docker generated_interface_native_preflight -- --ignored
              for test in python_combined model_free_preflight coding_failure coding_cancellation; do
                cargo test --locked --test tooling_docker "$test" -- --ignored
              done
              ;;
            rust)
              cargo test --locked --test prepared_toolchains rust_ -- --ignored
              cargo test --locked --test tooling_docker rust_direct -- --ignored
              cargo test --locked --test tooling_docker capability_contract -- --ignored
              ;;
            go)
              cargo test --locked --test prepared_toolchains go_ -- --ignored
              cargo test --locked --test tooling_docker go_direct -- --ignored
              ;;
            node)
              cargo test --locked --test prepared_toolchains -- --ignored --skip python_ --skip rust_ --skip go_
              cargo test --locked --test tooling_docker javascript_ -- --ignored
              cargo test --locked --test tooling_docker typescript_ -- --ignored
              ;;
          esac

  eal-compatibility:
    name: EAL producer and consumer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Source includes the runtime fixes and versioned collector contract producer.
      EAL_REVISION: ead1b9997b9c4f13d7d5409d87dff55afd9368b8
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install both declared toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install 1.90.0 --profile minimal
      - uses: ./.github/actions/cargo-cache
        with:
          scope: eal-contracts
          toolchains: 1.99.1
      - uses: ./.github/actions/eal-producer
        with:
          revision: ${{ env.EAL_REVISION }}
      - name: Check published collector descriptors
        run: |
          test "$(git -C .eal-producer rev-parse HEAD)" = "$EAL_REVISION"
          .eal-producer/target/debug/eal-collector describe > "$RUNNER_TEMP/eal-collector-catalogue.json"
          .eal-producer/target/debug/eal-collector describe --catalogue-version 3 > "$RUNNER_TEMP/eal-collector-catalogue-v3.json"
          python3 -c 'import json, os; from pathlib import Path; expected=json.loads(Path("contracts/collectors/native.json").read_text()); actual=json.loads((Path(os.environ["RUNNER_TEMP"])/"eal-collector-catalogue.json").read_text()); assert actual == expected, "published collector catalogue differs from the pinned consumer contract"'
          python3 -c 'import json, os; from pathlib import Path; expected=json.loads(Path("contracts/collectors/native-v3.json").read_text()); actual=json.loads((Path(os.environ["RUNNER_TEMP"])/"eal-collector-catalogue-v3.json").read_text()); assert actual == expected, "extended collector catalogue differs from the pinned consumer contract"'
      - name: Exercise portable EAL packages and independent collector domains
        run: |
          export ENGARG_EAL_HOST="$PWD/.eal-producer/target/debug/eal-host"
          export EAL_COLLECTOR="$PWD/.eal-producer/target/debug/eal-collector"
          export ENGARG_EAL_COORDINATE="$PWD/.eal-producer/target/debug/eal-coordinate"
          export EAL_CORE="$PWD/.eal-producer/target/debug/eal-core"
          export ENGARG_EAL_CORE="$EAL_CORE"
          test -x "$ENGARG_EAL_HOST"
          test -x "$EAL_CORE"
          test -x "$ENGARG_EAL_COORDINATE"
          cargo +1.99.1 test --locked --test tooling_docker generated_interface_native_preflight -- --ignored
          cargo +1.99.1 test --locked --test eal_live --test eal_export --test native_collectors --test collector_catalogue_live -- --ignored
          cargo +1.99.1 test --locked --test catalogue_workflow_native --test executable_package --test executable_modes --test aspic_view -- --ignored
          cargo +1.99.1 test --locked --test argument_investigation native_investigation -- --ignored

          # Keep one real CLI/coordinator smoke check in automatic compatibility.
          # Exhaustive native topology/ticket sweeps run in ticket-acceptance.yml.
          cargo +1.99.1 test --locked --test coordination_live the_actual_cli_coordinates_a_ring -- --ignored
          cargo +1.99.1 test --locked --test ticket_native unbound_operation_blocks_before_export_or_evidence_collection -- --ignored --nocapture
          cargo +1.99.1 test --locked --test ticket_native measured_negative_completes_and_unavailable_source_blocks -- --ignored --nocapture
