name: Ticket acceptance
run-name: Ticket acceptance (${{ github.event_name == 'workflow_dispatch' && inputs.topology || 'ring' }})

# PRs execute a direct ring ticket. Exhaustive topology sweeps require dispatch.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      topology:
        description: Topology for complete-ticket acceptance, or all nine
        required: true
        default: all
        type: choice
        options:
          - all
          - fully_connected
          - grouped
          - chain
          - ring
          - star
          - tree
          - layered
          - sparse
          - bipartite

permissions:
  contents: read

# New PR revisions supersede older PR work. Explicit manual runs retain results.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tickets:
    name: Native ticket acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
      # Native workers share one runner; bound build pressure and test concurrency.
      CARGO_BUILD_JOBS: '2'
      ENGARG_TICKET_TOPOLOGIES: ${{ github.event_name == 'workflow_dispatch' && inputs.topology || 'ring' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the declared toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install 1.90.0 --profile minimal
      - name: Read the exact EAL dependency revision
        id: source
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          manifest = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          dependencies = [value for name, value in manifest['dependencies'].items() if name.startswith('eal-')]
          pins = {(value.get('git'), value.get('rev')) for value in dependencies}
          if len(pins) != 1:
              raise SystemExit('EAL dependencies require one exact Git source revision')
          url, revision = pins.pop()
          if url != 'https://github.com/emmett08/eal-mcp' or not re.fullmatch(r'[0-9a-f]{40}', revision or ''):
              raise SystemExit('EAL acceptance requires the pinned companion repository')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          PY
      - uses: ./.github/actions/cargo-cache
        with:
          # Share consumer outputs and downloads with compatibility.
          scope: eal-contracts
          toolchains: 1.99.1
      - uses: ./.github/actions/eal-producer
        with:
          revision: ${{ steps.source.outputs.revision }}
      - name: Build the consumer
        run: cargo +1.99.1 build --locked --bins
      - name: Admit exact native companions
        env:
          EAL_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          test "$(git -C .eal-producer rev-parse HEAD)" = "$EAL_REVISION"
          for binary in eal eal-core eal-host eal-mcp eal-coordinate eal-collector eal-process-supervisor eal-tool-run eal-method-worker eal-aspic-solve; do
            test -x "$PWD/.eal-producer/target/debug/$binary"
          done
          test -x "$PWD/target/debug/engarg"
          test -x "$PWD/target/debug/engarg-process-supervisor"
          printf 'ENGARG_EAL_HOST=%s\nENGARG_EAL_COORDINATE=%s\n' \
            "$PWD/.eal-producer/target/debug/eal-host" \
            "$PWD/.eal-producer/target/debug/eal-coordinate" >> "$GITHUB_ENV"
      - name: Check native graph routing and CLI execution
        if: github.event_name == 'workflow_dispatch'
        run: cargo +1.99.1 test --locked --test coordination_live -- --include-ignored --nocapture --test-threads=1
      - name: Execute portable tickets and adverse source cases
        run: cargo +1.99.1 test --locked --test ticket_native -- --include-ignored --nocapture --test-threads=1
