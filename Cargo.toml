[package]
name = "engarg"
default-run = "engarg"
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
description = "Claim-first engineering arguments and evidence plans using extended Toulmin models"
license = "GPL-3.0-only"
repository = "https://github.com/emmett08/engarg"

[[bin]]
name = "engarg-process-supervisor"
path = "src/bin/process_supervisor.rs"

[dependencies]
eal-coordination-contracts = { git = "https://github.com/emmett08/eal-mcp", rev = "9da53e5caf1936a29663192779dc4991a0dd550f" }
eal-collector-contracts = { git = "https://github.com/emmett08/eal-mcp", rev = "9da53e5caf1936a29663192779dc4991a0dd550f" }
eal-process = { git = "https://github.com/emmett08/eal-mcp", rev = "9da53e5caf1936a29663192779dc4991a0dd550f" }
eal-adapters = { git = "https://github.com/emmett08/eal-mcp", rev = "9da53e5caf1936a29663192779dc4991a0dd550f" }
eal-core = { git = "https://github.com/emmett08/eal-mcp", rev = "9da53e5caf1936a29663192779dc4991a0dd550f" }
clap = { version = "4.6.7", features = ["derive", "env"] }
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
httpdate = "1.0.3"
jsonschema = { version = "0.46.0", default-features = false, features = ["arbitrary-precision"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1.1.2", features = ["fs"] }
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "io-util"] }
toml = "0.9.8"

[dev-dependencies]
tempfile = "3.27.0"
tiktoken-rs = "0.12.1"
rmcp = { git = "https://github.com/emmett08/eal-mcp", rev = "9da53e5caf1936a29663192779dc4991a0dd550f", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["io-std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
# ThinLTO failed to link with the pinned toolchain during verification.
lto = "off"
strip = true

