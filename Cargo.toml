[package]
name = "engarg"
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
description = "Claim-first engineering arguments and evidence plans using extended Toulmin models"
license = "GPL-3.0-only"
repository = "https://github.com/emmett08/engarg"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "process", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
# ThinLTO failed to link with the pinned toolchain during verification.
lto = "off"
strip = true

